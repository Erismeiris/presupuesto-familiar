# presupuesto.aresolutions.es — sitio estático de Angular en el mismo VPS que la API.
#
# Instalar en el VPS como /etc/nginx/sites-available/presupuesto y enlazar:
#   sudo ln -s /etc/nginx/sites-available/presupuesto /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El bloque de HTTPS lo escribe certbot solo (ver deploy/DESPLIEGUE.md). Este
# fichero es la versión de partida en HTTP para que certbot pueda validar.

server {
    listen 80;
    listen [::]:80;
    server_name presupuesto.aresolutions.es;

    root /var/www/presupuesto;
    index index.html;

    # Sin gzip, main.js viaja en 2.085 KB; con gzip, en 556 KB. El total de
    # texto baja de 2,4 MB a 659 KB (medido sobre el build del 2026-09-07).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # Las fuentes woff2 ya vienen comprimidas: volver a comprimirlas no baja
    # nada y gasta CPU en cada petición.

    # --- LO QUE MÁS SE OLVIDA ---------------------------------------------
    # Angular resuelve las rutas en el navegador: /presupuesto, /login,
    # /legal/privacidad… no son carpetas en disco. Sin este try_files, entrar
    # directo o recargar en cualquier ruta que no sea "/" devuelve 404. Se
    # sirve el fichero si existe, y si no, index.html para que el router decida.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los nombres de los bundles llevan hash (outputHashing: "all"), así que un
    # fichero concreto nunca cambia de contenido: se puede cachear para siempre.
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html es la excepción: es el único que apunta a los bundles nuevos.
    # Si se cachea, un despliegue no llega al navegador hasta que caduque.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # No hace falta proxy de /api: el frontend llama directamente a
    # https://api.presupuesto.aresolutions.es/api, que ya tiene su propio
    # servidor y su CORS con lista blanca.

    # Cabeceras de seguridad razonables para una aplicación de datos personales.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Un .xls o un .txt suelto en la raíz del sitio sería descargable por
    # cualquiera. El build no debería contener ninguno, pero por si acaso.
    location ~* \.(?:xls|xlsx|csv|txt|log|bak|env)$ {
        deny all;
        return 404;
    }
}
