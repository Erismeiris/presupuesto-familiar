<app-header/>
<div class="login-container">
  <div class="login-header">
    <h2>Nueva contraseña</h2>
    <p>Elige la contraseña con la que entrarás a partir de ahora</p>
  </div>

  <form *ngIf="token && !hecho" [formGroup]="form" (ngSubmit)="guardar()" class="login-form">
    <div class="form-group">
      <label for="password">Nueva contraseña</label>
      <p-password
        id="password"
        formControlName="password"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Al menos 6 caracteres"
        styleClass="w-full"
        inputStyleClass="w-full"
      ></p-password>
    </div>

    <div class="form-group">
      <label for="confirmar">Repite la contraseña</label>
      <p-password
        id="confirmar"
        formControlName="confirmar"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Escríbela otra vez"
        styleClass="w-full"
        inputStyleClass="w-full"
      ></p-password>
    </div>

    <div class="card">
      <p-message *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')" severity="error">
        La contraseña debe tener al menos 6 caracteres
      </p-message>
      <p-message *ngIf="form.controls.confirmar.touched && form.hasError('noCoinciden')" severity="error">
        Las contraseñas no coinciden
      </p-message>
    </div>

    <button type="submit" [disabled]="form.invalid || enviando" class="login-button">
      {{ enviando ? 'Guardando…' : 'Cambiar contraseña' }}
    </button>
  </form>

  <div class="card">
    <p-message *ngIf="mensajeOk" severity="success">{{ mensajeOk }}</p-message>
    <p-message *ngIf="mensajeError" severity="error">{{ mensajeError }}</p-message>
  </div>

  <div class="login-footer">
    <p *ngIf="mensajeError"><a routerLink="/forgot-password">Solicitar un enlace nuevo</a></p>
    <p><a routerLink="/login">Volver a iniciar sesión</a></p>
  </div>
</div>
