<app-header/>
<div class="login-container">
  <div class="login-header">
    <h2>¿Olvidaste la contraseña?</h2>
    <p>Te enviaremos un enlace para elegir una nueva</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="enviar()" class="login-form">
    <div class="form-group">
      <label for="usuario">Correo o nombre de usuario</label>
      <input
        type="text"
        id="usuario"
        formControlName="usuario"
        pInputText
        autocomplete="username"
        placeholder="Escribe tu correo o tu nombre de usuario"
      >
    </div>

    <button type="submit" [disabled]="form.invalid || enviando" class="login-button">
      {{ enviando ? 'Enviando…' : 'Enviar enlace' }}
    </button>

    <div class="card">
      <p-message *ngIf="mensajeOk" severity="success">{{ mensajeOk }}</p-message>
      <p-message *ngIf="mensajeError" severity="error">{{ mensajeError }}</p-message>
    </div>

    <div class="login-footer">
      <p><a routerLink="/login">Volver a iniciar sesión</a></p>
    </div>
  </form>
</div>
