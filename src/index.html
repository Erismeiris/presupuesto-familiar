<!doctype html>
<!-- lang="es": la aplicación está íntegramente en español. Estaba en "en", que
     hace que los lectores de pantalla la lean con fonética inglesa, estropea el
     guionado y desorienta a los buscadores. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Control de presupuesto familiar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Control del presupuesto mensual de casa: previsto contra real por categoría, saldo arrastrado de un mes al siguiente e importación de los movimientos del banco.">
  <!-- El tono del papel de la aplicación, para que la barra del navegador en
       móvil no corte con un bloque de otro color. -->
  <meta name="theme-color" content="#fcfbf7">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
